<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конфігурація лабораторії та інспекторів</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #6c757d;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --danger-color: #dc3545;
      --success-color: #198754;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      color: var(--primary-color);
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
    }

    .section {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 25px;
      background-color: #fafafa;
    }

    .inspector-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-color);
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
      position: relative;
    }

    .inspector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .inspector-grid .full-width {
      grid-column: span 2;
    }

    .btn {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary { background-color: var(--primary-color); color: #fff; }
    .btn-primary:hover { background-color: #004085; }

    .btn-secondary { background-color: var(--secondary-color); color: #fff; }
    .btn-secondary:hover { background-color: #5a6268; }

    .btn-danger { background-color: var(--danger-color); color: #fff; padding: 6px 12px; font-size: 12px; }
    .btn-danger:hover { background-color: #bb2d3b; }

    .btn-success { background-color: var(--success-color); color: #fff; }
    .btn-success:hover { background-color: #157347; }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: bold;
      color: #555;
    }

    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Налаштування випробувальної лабораторії</h1>
  <p>Форма для введення базових конфігурацій компанії та списку інспекторів.</p>

  <form id="configForm">
    <!-- Блок Компании и Лаборатории -->
    <div class="section">
      <h2>1. Загальні дані</h2>
      <div class="form-group">
        <label for="firma_name">Назва компанії / лабораторії (firma.name):</label>
        <input type="text" id="firma_name" name="firma_name" placeholder="ТОВ «Авто-Лаб»" required>
      </div>

      <div class="form-group">
        <label for="laboratory_number">Номер дільниці лабораторії (laboratory.number):</label>
        <input type="text" id="laboratory_number" name="laboratory_number" placeholder="№ 1" required>
      </div>
    </div>

    <!-- Блок Инспекторов -->
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>2. Список інспекторів (inspectors)</h2>
        <button type="button" class="btn btn-secondary" onclick="addInspector()">+ Додати інспектора</button>
      </div>

      <div id="inspectorsContainer">
        <!-- Карточки инспекторов генерируются динамически JS -->
      </div>
    </div>

    <!-- Кнопки управления -->
    <div class="actions">
      <button type="button" class="btn btn-secondary" onclick="loadSampleData()">Завантажити демо-дані</button>
      <button type="button" class="btn btn-success" onclick="downloadJSON()">Завантажити config.json</button>
    </div>
  </form>

  <!-- Превью JSON -->
  <div style="margin-top: 30px;">
    <h3>Попередній перегляд JSON:</h3>
    <pre id="jsonPreview">{}</pre>
  </div>
</div>

<script>
  let inspectorCount = 0;

  // Инициализация формы с одним инспектором
  window.onload = function() {
    addInspector('Провідний інженер з технічного контролю', 'Олександр', 'Сидоренко');
    updateJSONPreview();
  };

  // Функция добавления нового карточки инспектора
  function addInspector(position = '', firstName = '', lastName = '') {
    inspectorCount++;
    const container = document.getElementById('inspectorsContainer');

    const card = document.createElement('div');
    card.className = 'inspector-card';
    card.id = `inspector_${inspectorCount}`;

    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">Інспектор №${inspectorCount}</span>
        <button type="button" class="btn btn-danger" onclick="removeInspector('${card.id}')">Видалити</button>
      </div>
      <div class="inspector-grid">
        <div class="form-group full-width">
          <label>Посада (position):</label>
          <input type="text" class="insp-position" value="${position}" placeholder="Провідний інженер" oninput="updateJSONPreview()" required>
        </div>
        <div class="form-group">
          <label>Ім'я (first_name):</label>
          <input type="text" class="insp-first-name" value="${firstName}" placeholder="Олександр" oninput="updateJSONPreview()" required>
        </div>
        <div class="form-group">
          <label>Прізвище (last_name):</label>
          <input type="text" class="insp-last-name" value="${lastName}" placeholder="Сидоренко" oninput="updateJSONPreview()" required>
        </div>
      </div>
    `;

    container.appendChild(card);
    updateJSONPreview();
  }

  // Удаление карточки инспектора
  function removeInspector(id) {
    const card = document.getElementById(id);
    if (document.querySelectorAll('.inspector-card').length > 1) {
      card.remove();
      updateJSONPreview();
    } else {
      alert('В конфігурації повинен залишатися хоча б один інспектор!');
    }
  }

  // Сбор данных формы в JSON объект
  function getConfigDataObject() {
    const firmaName = document.getElementById('firma_name').value;
    const labNumber = document.getElementById('laboratory_number').value;

    const inspectorCards = document.querySelectorAll('.inspector-card');
    const inspectors = [];

    inspectorCards.forEach((card, index) => {
      inspectors.push({
        id: `insp_${index + 1}`,
        position: card.querySelector('.insp-position').value,
        first_name: card.querySelector('.insp-first-name').value,
        last_name: card.querySelector('.insp-last-name').value
      });
    });

    return {
      firma: {
        name: firmaName
      },
      laboratory: {
        number: labNumber
      },
      inspectors: inspectors
    };
  }

  // Обновление реального времени предпросмотра
  function updateJSONPreview() {
    const data = getConfigDataObject();
    document.getElementById('jsonPreview').textContent = JSON.stringify(data, null, 2);
  }

  // Слушатели для полей компании и лаборатории
  document.getElementById('firma_name').addEventListener('input', updateJSONPreview);
  document.getElementById('laboratory_number').addEventListener('input', updateJSONPreview);

  // Загрузка демо-данных
  function loadSampleData() {
    document.getElementById('firma_name').value = 'ТОВ «Авто-Лаб-Сервіс»';
    document.getElementById('laboratory_number').value = '№ 1';

    const container = document.getElementById('inspectorsContainer');
    container.innerHTML = '';
    inspectorCount = 0;

    addInspector('Провідний інженер з технічного контролю', 'Олександр', 'Сидоренко');
    addInspector('Старший інспектор-експерт', 'Василь', 'Коваленко');

    updateJSONPreview();
  }

  // Скачивание сформированного JSON-файла
  function downloadJSON() {
    const data = getConfigDataObject();
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'config.json';
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
